<span class="brand">Home dashboards</span>

<app-tab-strip [links]="links()" />

@if (note()) {
  <span class="note" [title]="note()">{{ note() }}</span>
}
<a class="credit" href="https://github.com/kananlanginhooper" target="_blank" rel="noopener"
  >Built by Kanan Hooper</a
>
@if (active(); as t) {
  <a
    mat-button
    class="open"
    [href]="route.urlFor(t)"
    target="_blank"
    rel="noopener"
    [attr.aria-label]="'Open ' + t.title + ' on its own'"
    [matTooltip]="'Open ' + t.title + ' on its own'"
    >↗</a
  >
}
