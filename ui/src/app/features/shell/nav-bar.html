<span class="brand">Home dashboards</span>

<nav mat-tab-nav-bar [tabPanel]="panel" mat-stretch-tabs="false" mat-align-tabs="start">
  @for (t of tabs(); track t.id) {
    <a
      mat-tab-link
      [routerLink]="['/', t.id]"
      routerLinkActive
      #rla="routerLinkActive"
      [active]="rla.isActive"
      [matTooltip]="t.description || t.title"
      >{{ t.title }}</a
    >
  }
</nav>
<mat-tab-nav-panel #panel />

<!-- phones: the strip above is hidden; this button shows the active tab and opens the list -->
<button mat-button class="picker" [matMenuTriggerFor]="menu" aria-label="Choose a dashboard">
  <span class="picker-label">{{ active()?.title || 'Home dashboards' }}</span>
  <span class="caret" aria-hidden="true">▾</span>
</button>
<mat-menu #menu="matMenu" class="tab-menu">
  @for (t of tabs(); track t.id) {
    <a
      mat-menu-item
      [routerLink]="['/', t.id]"
      [attr.aria-current]="t.id === activeId() ? 'page' : null"
      >{{ t.title }}</a
    >
  }
</mat-menu>

@if (note()) {
  <span class="note" [title]="note()">{{ note() }}</span>
}
@if (active(); as t) {
  <a
    mat-button
    class="open"
    [href]="t.url"
    target="_blank"
    rel="noopener"
    [attr.aria-label]="'Open ' + t.title + ' on its own'"
    [matTooltip]="'Open ' + t.title + ' on its own'"
    >↗</a
  >
}
