<nav aria-label="Dashboards">
  @for (t of inBar(); track t.id) {
    <a
      class="slot"
      [routerLink]="['/', t.id]"
      [class.current]="t.id === activeId()"
      [attr.aria-current]="t.id === activeId() ? 'page' : null"
    >
      <span class="icon" aria-hidden="true">{{ icon(t) }}</span>
      <span class="label">{{ short(t) }}</span>
    </a>
  }
  <button
    type="button"
    class="slot"
    [class.current]="activeInMore()"
    (click)="openMore()"
    aria-haspopup="dialog"
  >
    @if (activeInMore(); as t) {
      <span class="icon" aria-hidden="true">{{ icon(t) }}</span>
      <span class="label">{{ short(t) }}</span>
    } @else {
      <span class="icon" aria-hidden="true">more_horiz</span>
      <span class="label">More</span>
    }
    @if (note()) {
      <span class="dot" aria-label="Status note in More"></span>
    }
  </button>
</nav>

<ng-template #moreSheet>
  <div class="sheet">
    @for (t of inMore(); track t.id) {
      <a
        class="row"
        [routerLink]="['/', t.id]"
        [class.current]="t.id === activeId()"
        [attr.aria-current]="t.id === activeId() ? 'page' : null"
        (click)="closeMore()"
      >
        <span class="icon" aria-hidden="true">{{ icon(t) }}</span
        >{{ t.title }}
      </a>
    }
    @if (active(); as t) {
      <a class="row open" [href]="route.urlFor(t)" target="_blank" rel="noopener" (click)="closeMore()">
        <span class="icon" aria-hidden="true">open_in_new</span>Open {{ t.title }} on its own
      </a>
    }
    @if (note()) {
      <p class="note">{{ note() }}</p>
    }
  </div>
</ng-template>
