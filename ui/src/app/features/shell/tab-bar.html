<app-bottom-nav [links]="links()" [dot]="!!note()">
  <ng-template let-close>
    @if (active(); as t) {
      <a class="row open" [href]="route.urlFor(t)" target="_blank" rel="noopener" (click)="close()">
        <span class="icon" aria-hidden="true">open_in_new</span>Open {{ t.title }} on its own
      </a>
    }
    @if (note()) {
      <p class="note">{{ note() }}</p>
    }
    <a class="credit" href="https://github.com/kananlanginhooper" target="_blank" rel="noopener"
      >Built by Kanan Hooper</a
    >
  </ng-template>
</app-bottom-nav>
